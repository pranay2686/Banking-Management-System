{% extends 'shared/base.html' %}
{% block title %}Deposit — BMS{% endblock %}

{% block content %}
<div class="form-container">
    <h2>💰 Deposit Money</h2>
    <form method="POST" action="{{ url_for('transactions.deposit') }}">
        <div class="form-group">
            <label>Select Account</label>
            <select name="account_id" required>
                {% for account in accounts %}
                <option value="{{ account.id }}">
                    {{ account.account_number }} — ₹{{ "%.2f" | format(account.balance) }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" name="amount" required min="1" placeholder="Enter amount">
        </div>
        <div class="form-group">
            <label>Description (optional)</label>
            <input type="text" name="description" placeholder="e.g. Salary credit">
        </div>
        <button type="submit" class="btn-primary">Deposit</button>
        <a href="{{ url_for('accounts.dashboard') }}" class="btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
