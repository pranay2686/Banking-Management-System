{% extends 'shared/base.html' %}
{% block title %}Transfer — BMS{% endblock %}

{% block content %}
<div class="form-container">
    <h2>🔄 Transfer Money</h2>
    <form method="POST" action="{{ url_for('transactions.transfer') }}">
        <div class="form-group">
            <label>From Account</label>
            <select name="from_account_id" required>
                {% for account in accounts %}
                <option value="{{ account.id }}">
                    {{ account.account_number }} — ₹{{ "%.2f" | format(account.balance) }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Target Account Number</label>
            <input type="text" name="target_account_number" required placeholder="e.g. BMS1234567890">
        </div>
        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" name="amount" required min="1" placeholder="Enter amount">
        </div>
        <button type="submit" class="btn-primary">Transfer</button>
        <a href="{{ url_for('accounts.dashboard') }}" class="btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
