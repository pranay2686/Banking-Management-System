{% extends 'shared/base.html' %}
{% block title %}Apply for Loan — BMS{% endblock %}

{% block content %}
<div class="form-container">
    <h2>🏦 Apply for a Loan</h2>
    <form method="POST" action="{{ url_for('loans.apply') }}">
        <div class="form-group">
            <label>Loan Type</label>
            <select name="loan_type" required>
                <option value="personal">Personal</option>
                <option value="home">Home</option>
                <option value="education">Education</option>
                <option value="vehicle">Vehicle</option>
            </select>
        </div>
        <div class="form-group">
            <label>Loan Amount (₹)</label>
            <input type="number" name="amount" required min="1000" placeholder="Enter loan amount">
        </div>
        <div class="form-group">
            <label>Tenure (months)</label>
            <select name="tenure_months" required>
                <option value="6">6 months</option>
                <option value="12">12 months</option>
                <option value="24">24 months</option>
                <option value="36">36 months</option>
                <option value="48">48 months</option>
                <option value="60">60 months</option>
            </select>
        </div>
        <div class="form-group">
            <label>Linked Account</label>
            <select name="account_id" required>
                {% for account in accounts %}
                <option value="{{ account.id }}">
                    {{ account.account_number }} — ₹{{ "%.2f" | format(account.balance) }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Reason for Loan (optional)</label>
            <textarea name="reason" rows="3" placeholder="Briefly describe why you need this loan..."></textarea>
        </div>
        <button type="submit" class="btn-primary">Submit Application</button>
        <a href="{{ url_for('accounts.dashboard') }}" class="btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
