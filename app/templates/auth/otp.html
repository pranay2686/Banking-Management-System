{% extends 'shared/base.html' %}
{% block title %}Verify OTP — BMS{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>🔑 OTP Verification</h2>
    <p>An OTP has been sent to <strong>{{ email }}</strong>. It is valid for 5 minutes.</p>
    <form method="POST" action="{{ url_for('auth.verify_otp') }}">
        <div class="form-group">
            <label>Enter OTP</label>
            <input type="text" name="otp" required placeholder="6-digit OTP" maxlength="6" autofocus>
        </div>
        <button type="submit" class="btn-primary">Verify OTP</button>
    </form>
    <p class="auth-link"><a href="{{ url_for('auth.login') }}">← Back to Login</a></p>
</div>
{% endblock %}
