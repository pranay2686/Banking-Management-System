services:

  db:
    image: mysql:8.0
    container_name: bms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bms_db
      MYSQL_USER: bms_user
      MYSQL_PASSWORD: bms_password123
    ports:
      - "3306:3306"
    volumes:
      - bms_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  web:
    build: .
    container_name: bms_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  bms_mysql_data: